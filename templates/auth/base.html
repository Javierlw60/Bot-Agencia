<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Acceso{% endblock %} · Bot Agencias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/dashboard.css">
  <style>
    :root {
      --brand: #3B82F6;
      --surface: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --title: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--surface);
      color: var(--title);
      min-height: 100%;
    }
    .auth-wrap {
      max-width: 28rem;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      width: 100%;
    }
    .ui-card {
      background: linear-gradient(155deg,
        color-mix(in srgb, var(--card) 92%, var(--title)) 0%,
        var(--card) 50%,
        color-mix(in srgb, var(--card) 96%, var(--surface)) 100%);
      border: 1px solid var(--border);
      border-radius: 0.625rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
    }
    .ui-label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .ui-input {
      width: 100%;
      border-radius: 0.375rem;
      padding: 0.55rem 0.75rem;
      font-size: 0.875rem;
      color: var(--title);
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .ui-input:focus {
      outline: none;
      border-color: color-mix(in srgb, var(--brand) 55%, var(--border));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent);
    }
    .btn-primary {
      width: 100%;
      border-radius: 0.375rem;
      padding: 0.65rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: #fff;
      background: var(--brand);
      transition: opacity 0.15s ease;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.92; }
    .btn-primary:disabled { opacity: 0.6; cursor: wait; }
    .auth-alert {
      border-radius: 0.375rem;
      padding: 0.65rem 0.85rem;
      font-size: 0.8125rem;
      line-height: 1.5;
    }
    .auth-alert-error {
      background: color-mix(in srgb, #450a0a 70%, var(--card));
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #fca5a5;
    }
    .auth-alert-ok {
      background: color-mix(in srgb, #064e3b 70%, var(--card));
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }
    .auth-link { color: var(--muted); font-size: 0.8125rem; }
    .auth-link a { color: #93c5fd; text-decoration: underline; }
  </style>
</head>
<body class="flex min-h-full items-center justify-center px-4 py-8">
  <div class="auth-wrap">
    <div class="mb-6 text-center">
      <p class="text-lg font-semibold tracking-tight" style="color: var(--title);">Bot Agencias</p>
      <p class="mt-1 text-sm" style="color: var(--muted);">Panel de gestión</p>
    </div>
    {% block content %}{% endblock %}
  </div>
  <script>
    document.querySelectorAll('form.js-save-form').forEach(function (form) {
      form.addEventListener('submit', function () {
        var btn = form.querySelector('[type="submit"]');
        if (btn && !btn.disabled) {
          btn.disabled = true;
          btn.textContent = btn.dataset.savingText || 'Guardando...';
        }
      });
    });
    document.querySelectorAll('.ui-input[required]').forEach(function (el) {
      el.addEventListener('invalid', function () {
        el.setCustomValidity('Completá este campo correctamente.');
      });
      el.addEventListener('input', function () { el.setCustomValidity(''); });
    });
  </script>
</body>
</html>
