{% extends "auth/base.html" %}
{% block title %}Completando acceso{% endblock %}
{% block content %}
<div class="ui-card p-6 text-center">
  <h1 class="text-lg font-semibold" style="color: var(--title);">Completando acceso con Google</h1>
  <p id="estado" class="mt-2 text-sm" style="color: var(--muted);">Un momento…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const SUPABASE_URL = {{ supabase_url|tojson }};
  const SUPABASE_ANON_KEY = {{ supabase_anon_key|tojson }};
  const estado = document.getElementById('estado');

  function irLogin(mensaje) {
    estado.textContent = mensaje;
    setTimeout(function () {
      window.location.href = '/auth/login?error=' + encodeURIComponent(mensaje);
    }, 1500);
  }

  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    irLogin('Faltan SUPABASE_URL o SUPABASE_ANON_KEY en el servidor (Render).');
    return;
  }

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      flowType: 'pkce',
      detectSessionInUrl: true,
    },
  });

  async function sesionDesdeHash() {
    const hash = window.location.hash.replace(/^#/, '');
    if (!hash) return null;
    const params = new URLSearchParams(hash);
    const access_token = params.get('access_token');
    const refresh_token = params.get('refresh_token');
    if (!access_token) return null;
    const { data, error } = await supabaseClient.auth.setSession({
      access_token: access_token,
      refresh_token: refresh_token || '',
    });
    if (error) throw error;
    return data.session;
  }

  async function finalizar() {
    try {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      if (code) {
        const { error } = await supabaseClient.auth.exchangeCodeForSession(code);
        if (error) throw error;
      } else {
        await sesionDesdeHash();
      }

      const { data, error: sessionError } = await supabaseClient.auth.getSession();
      if (sessionError) throw sessionError;

      const user = data.session && data.session.user;
      if (!user || !user.email) {
        irLogin('No se pudo obtener tu correo de Google.');
        return;
      }

      const nombre =
        (user.user_metadata && (user.user_metadata.full_name || user.user_metadata.name)) ||
        user.email.split('@')[0];

      window.location.replace(
        '/auth/supabase-callback?email=' +
          encodeURIComponent(user.email) +
          '&nombre=' +
          encodeURIComponent(nombre)
      );
    } catch (err) {
      console.error(err);
      irLogin('Error al completar el acceso con Google.');
    }
  }

  finalizar();
})();
</script>
{% endblock %}
