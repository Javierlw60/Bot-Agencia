<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Sin conexión — Panel</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    .card {
      max-width: 22rem;
      padding: 2rem;
      border-radius: 0.625rem;
      border: 1px solid #334155;
      background: #1e293b;
    }
    h1 { font-size: 1.125rem; margin: 0 0 0.5rem; }
    p { margin: 0; font-size: 0.875rem; color: #94a3b8; line-height: 1.55; }
    button {
      margin-top: 1.25rem;
      width: 100%;
      padding: 0.65rem 1rem;
      border: none;
      border-radius: 0.375rem;
      background: #3B82F6;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Las páginas visitadas recientemente pueden seguir disponibles.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
